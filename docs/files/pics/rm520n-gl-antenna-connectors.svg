<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="720" fill="#ffffff"/>

  <text x="320" y="22" font-size="13" text-anchor="middle" fill="#333">M.2 Key B edge connector (goes into the Flipper One M.2 slot)</text>

  <!-- Gold fingers with the Key B gap -->
  <rect x="190" y="38" width="48" height="24" fill="#e8c86a" stroke="#333" stroke-width="1.5"/>
  <rect x="252" y="38" width="198" height="24" fill="#e8c86a" stroke="#333" stroke-width="1.5"/>

  <!-- Module body, 30 x 52 mm, with the screw notch cut into the bottom edge -->
  <path d="M170 62 H470 V590 H322 A14 14 0 0 0 294 590 H170 Z" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="320" y="300" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">RM520N-GL</text>
  <text x="320" y="326" font-size="14" text-anchor="middle" fill="#555">label side up</text>

  <!-- Antenna connectors -->
  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <circle cx="186" cy="560" r="11"/>
    <circle cx="226" cy="560" r="11"/>
    <circle cx="266" cy="560" r="11"/>
    <circle cx="350" cy="560" r="11"/>
  </g>
  <g fill="#333">
    <circle cx="186" cy="560" r="3"/>
    <circle cx="226" cy="560" r="3"/>
    <circle cx="266" cy="560" r="3"/>
    <circle cx="350" cy="560" r="3"/>
  </g>

  <!-- Square pads: not antenna connectors -->
  <g stroke="#999" stroke-width="1.5" fill="none">
    <rect x="392" y="552" width="16" height="16"/>
    <rect x="428" y="552" width="16" height="16"/>
  </g>
  <text x="418" y="540" font-size="11" text-anchor="middle" fill="#999">not antennas</text>

  <!-- Leader lines fanning out to the labels -->
  <g stroke="#333" stroke-width="1.2" fill="none">
    <polyline points="186,571 186,600 90,640"/>
    <polyline points="226,571 226,600 240,640"/>
    <polyline points="266,571 266,606 390,640"/>
    <polyline points="350,571 350,596 540,640"/>
  </g>

  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="90" y="660">ANT0</text>
    <text x="240" y="660">ANT1</text>
    <text x="390" y="660">ANT2</text>
    <text x="540" y="660">ANT3</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="90" y="680">Main</text>
    <text x="90" y="696">TX + primary RX</text>
    <text x="240" y="680">MIMO RX</text>
    <text x="240" y="696">GNSS L5</text>
    <text x="390" y="680">MIMO RX</text>
    <text x="390" y="696">TX for n77/n78/n79</text>
    <text x="540" y="680">Diversity RX</text>
    <text x="540" y="696">GNSS L1</text>
  </g>
</svg>
